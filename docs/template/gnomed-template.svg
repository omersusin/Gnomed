<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gnomed icon template (128 x 128, the GNOME app icon canvas).
  Draw in the layer "icon" (Inkscape: Layers panel). Hide "guides" before exporting.
  - keylines (dashed): the official GNOME HIG template shapes - circle r 59.5, square 103,
    tall 87 x 111, wide 111 x 87 (corner radius 8). Pick the ONE closest to your object;
    its size gives the same visual weight as every other icon.
  - baseline (blue band 116-118): the bottom edge of the object INCLUDING its front profile.
    Gnomed target: 118.
  - safe area (red): most objects stay inside 8..120; a ROUND object may follow the circle
    keyline (4.5..123.5) like GNOME's own round icons. Never touch the canvas edge.
  - grid: 8 px (strong every 32). Keep details >= 2 px (they vanish at 32 px).
  Colours: docs/palette/ (GNOME HIG). Rules: REDESIGN.md. Save as Plain SVG, no strokes, no text.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="128" height="128" viewBox="0 0 128 128">
  <sodipodi:namedview pagecolor="#f6f5f4" showgrid="false" inkscape:zoom="4"/>
  <g inkscape:groupmode="layer" id="guides" inkscape:label="guides (hide before export)" sodipodi:insensitive="true">
    <rect width="128" height="128" fill="#f6f5f4"/>
    <path d="M0 0V128M0 0H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.5"/><path d="M8 0V128M0 8H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M16 0V128M0 16H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M24 0V128M0 24H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M32 0V128M0 32H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.5"/><path d="M40 0V128M0 40H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M48 0V128M0 48H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M56 0V128M0 56H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M64 0V128M0 64H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.5"/><path d="M72 0V128M0 72H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M80 0V128M0 80H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M88 0V128M0 88H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M96 0V128M0 96H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.5"/><path d="M104 0V128M0 104H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M112 0V128M0 112H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M120 0V128M0 120H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.25"/><path d="M128 0V128M0 128H128" stroke="#3584e4" stroke-opacity="0.18" stroke-width="0.5"/>
    <rect x="8" y="8" width="112" height="112" fill="none" stroke="#e01b24" stroke-opacity="0.35" stroke-width="0.5"/>
    <g fill="none" stroke="#241f31" stroke-opacity="0.3" stroke-width="0.6" stroke-dasharray="1.2 1.2">
      <circle cx="64" cy="64" r="59.5"/>
      <rect x="12.5" y="12.5" width="103" height="103" rx="8"/>
      <rect x="20.5" y="8.5" width="87" height="111" rx="8"/>
      <rect x="8.5" y="28.5" width="111" height="87" rx="8"/>
    </g>
    <rect x="0" y="116" width="128" height="2" fill="#3584e4" fill-opacity="0.55"/>
  </g>
  <g inkscape:groupmode="layer" id="icon" inkscape:label="icon">
  </g>
</svg>
