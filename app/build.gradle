apply plugin: 'com.android.application'

android {
    compileSdk = rootProject.ext.CompileSdk

    namespace 'gnomed.it'

    defaultConfig {
        applicationId 'gnomed.it'
        minSdkVersion rootProject.ext.MinSdk
        targetSdkVersion rootProject.ext.TargetSdk
        // CI passes the run number so every release can update the previous one.
        versionCode((System.getenv('GNOMED_VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('GNOMED_VERSION_NAME') ?: '1.0')
    }

    bundle {
        language {
            enableSplit false
        }
    }

    // One APK per icon style. All styles share ONE applicationId, so switching style
    // in the app is an ordinary update of the same package (same signing key needed).
    // Per-style files live in app/src/<style>/ and are generated by tools/gen_styles.py.
    flavorDimensions = ['style']
    productFlavors {
        faithful { dimension 'style' }
        disc { dimension 'style' }
        rimmed { dimension 'style' }
        symbol { dimension 'style' }
    }

    // Release signing comes from environment variables (GitHub Actions secrets).
    // Without them the release build falls back to the debug key.
    def ks = System.getenv('GNOMED_KEYSTORE')
    signingConfigs {
        if (ks != null && file(ks).exists()) {
            gnomed {
                storeFile file(ks)
                storePassword System.getenv('GNOMED_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GNOMED_KEY_ALIAS')
                keyPassword System.getenv('GNOMED_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig(ks != null && file(ks).exists() ? signingConfigs.gnomed : signingConfigs.debug)
        }
    }

    lint {
        abortOnError false
    }
}

base {
    // Output file name
    archivesName = "${parent.name}-${android.defaultConfig.versionCode}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    /*
     * CandyBar Material Dashboard Library
     *
     * TODO: How to update the dashboard?!
     * Check this update guide for every version
     *      - https://github.com/zixpo/candybar-sample/wiki/Updating-the-dashboard
     * If you've missed some versions you've to also follow update guide for those versions
     */

    implementation 'com.github.zixpo:candybar:3.23.0'

    // Used directly by MainActivity (drawer entry for the icon style picker);
    // same version as the CandyBar library uses internally.
    implementation 'com.google.android.material:material:1.13.0'

    // TODO: Remove `//` below to enable OneSignal
    //implementation 'com.onesignal:OneSignal:[5.0.0, 5.99.99]'
}

// Code for automatically copying appfilter.xml and drawable.xml
// from `res/xml` directory to `assets` directory
tasks.register('copyXMLs') {
    ['appfilter.xml', 'drawable.xml'].each { file ->
        copy {
            from "$projectDir/src/main/res/xml/$file"
            into "$projectDir/src/main/assets/"
        }
    }
}

tasks.configureEach { task ->
    // preBuild runs for every flavor/build type (assembleDiscRelease, ...)
    if (task.name == 'preBuild') {
        task.dependsOn copyXMLs
    }
}
