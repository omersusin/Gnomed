name: Build Gnomed

# Builds one APK per icon style (faithful, disc, rimmed, symbol).
# - every push / PR: build + upload the APKs as a workflow artifact
# - tag v* or manual run with "release" ticked: also publish a GitHub release;
#   the in-app style switch downloads gnomed-<style>.apk from the latest release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (tag v1.0.<run number>)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GNOMED_VERSION_CODE: ${{ github.run_number }}
      GNOMED_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Per-style files are up to date
        run: python3 tools/gen_styles.py --check

      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.GNOMED_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gnomed.p12"
            echo "GNOMED_KEYSTORE=$RUNNER_TEMP/gnomed.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::GNOMED_KEYSTORE_BASE64 secret missing - APKs are signed with a throw-away debug key; in-app style switching across releases will fail."
          fi

      - name: Build all styles
        env:
          GNOMED_KEYSTORE_PASSWORD: ${{ secrets.GNOMED_KEYSTORE_PASSWORD }}
          GNOMED_KEY_ALIAS: ${{ secrets.GNOMED_KEY_ALIAS }}
          GNOMED_KEY_PASSWORD: ${{ secrets.GNOMED_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          for s in faithful disc rimmed symbol; do
            f=$(ls app/build/outputs/apk/$s/release/*.apk | head -n1)
            cp "$f" "dist/gnomed-$s.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: gnomed-apks-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Gnomed ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
